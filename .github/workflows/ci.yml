name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 本项目零运行时依赖；CI 只装 dev extra（pytest）。
# 编码：`PYTHONUTF8=1` 让 pytest 自身的中文打印在 cp1252 管道下也不崩
#   （本机 `-X utf8` 管不到 CI 里别人敲的命令，见 AGENTS.md 环境事实）。
env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: "py${{ matrix.python }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: "Install (runtime only first — proves zero third-party deps)"
        run: python -m pip install .

      - name: "Smoke: console script"
        run: mimeconform --version

      - name: "Smoke: module entrypoint (different sys.path source)"
        run: python -m mimeconform --version

      - name: "Smoke: exit code 1 on unreadable input"
        shell: bash
        run: |
          # 契约退出码必须用 set +e 捕获再断言，别让 set -e 在"检出问题"处提前中断
          set +e
          mimeconform audit does-not-exist.eml
          code=$?
          set -e
          echo "audit(missing file) rc=$code"
          test "$code" = "1"

      - name: "Install dev extras"
        run: python -m pip install ".[dev]"

      - name: "Sprint layout gate (methodology binding)"
        run: python tools/check_sprint_layout.py

      - name: "Desensitization gate (no host paths / usernames / loopback proxy)"
        run: python tools/check_desensitized.py

      - name: "Layout gate mutation verification (16 groups; must all behave as expected)"
        run: python tools/verify_layout_gate.py

      - name: "Full test suite"
        run: python -m pytest -q

  offline:
    name: "offline (no network at runtime, no third-party imports)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 运行期完全无网络；构建期允许拉基础镜像。
      # 镜像内**不 pip install** —— 直接 COPY 就说明"无安装步骤也能跑"。
      - name: "Build offline image"
        run: |
          docker build -f .github/offline.Dockerfile -t mimeconform-offline .

      - name: "Prove zero third-party imports + run selftest path offline"
        run: |
          docker run --rm --network none mimeconform-offline \
            python -c "import mimeconform, sys; print('version', mimeconform.__version__); print('third-party imports:', [m for m in ('yaml','pytest') if m in sys.modules])"

      - name: "Offline CLI smoke (stdout must stay clean of third-party modules)"
        run: |
          set +e
          docker run --rm --network none mimeconform-offline python -m mimeconform --version
          code=$?
          set -e
          test "$code" = "0"
