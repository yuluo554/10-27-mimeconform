[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimeconform"
version = "0.0.0.dev0"
description = "MIME structural conformance ledger: defect + position + severity + RFC citation, from raw bytes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "yuluo554" }]
keywords = ["mime", "email", "rfc2045", "rfc2046", "rfc2047", "rfc2231", "mbox", "lint", "audit"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
mimeconform = "mimeconform.cli:main"

[project.urls]
Homepage = "https://github.com/yuluo554/10-27-mimeconform"

[tool.setuptools]
packages = ["mimeconform", "mimeconform.devtools", "mimeconform.rules"]

[tool.setuptools.package-data]
mimeconform = ["rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
